name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p tello-core -p tello-sim -p tello-cli --all-targets -- -D warnings
      - run: cargo test -p tello-core -p tello-sim -p tello-cli

  cli-windows:
    name: tello-cli (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tello-cli -p tello-sim
      - uses: actions/upload-artifact@v4
        with:
          name: tello-cli-windows
          path: |
            target/release/tello-cli.exe
            target/release/tello-sim.exe
