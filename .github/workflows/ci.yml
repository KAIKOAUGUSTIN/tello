name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p tello-core -p tello-sim -p tello-cli --all-targets -- -D warnings
      - run: cargo test -p tello-core -p tello-sim -p tello-cli

  ui:
    name: Interface (checagem e build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  cli-windows:
    name: tello-cli (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p tello-cli -p tello-sim
      - uses: actions/upload-artifact@v7
        with:
          name: tello-cli-windows
          path: |
            target/release/tello-cli.exe
            target/release/tello-sim.exe

  app-windows:
    name: Tello Pilot (instalador Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo clippy -p tello-client -- -D warnings
      - run: npx tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: tello-pilot-windows
          path: target/release/bundle/nsis/*.exe
