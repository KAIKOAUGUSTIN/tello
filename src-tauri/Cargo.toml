[package]
name = "tello-client"
description = "Cliente desktop para o drone Tello"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "tello_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde.workspace = true
serde_json.workspace = true
tello-core.workspace = true
tauri-plugin-tello-mobile = { path = "../crates/tauri-plugin-tello-mobile" }
